plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

configurations {
    nfdTypes {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    // Only types are needed; the game provides LWJGL at runtime.
    compileOnly 'org.lwjgl:lwjgl:3.3.6'
    compileOnly 'org.lwjgl:lwjgl-nfd:3.3.6'
    // Shipped so games without lwjgl-nfd still get the NFD argument types
    // that NativeFileDialog references.
    nfdTypes 'org.lwjgl:lwjgl-nfd:3.3.6'
}

// Ship the NFD argument structs that flashback-style mods reference even
// when the game has no lwjgl-nfd jar. NativeFileDialog and NFDPathSet come
// from this project's own source set and replace the upstream classes.
jar {
    from({ configurations.nfdTypes.collect { zipTree(it) } }) {
        include 'org/lwjgl/util/nfd/**'
        exclude 'org/lwjgl/util/nfd/NativeFileDialog.class'
    }
}
